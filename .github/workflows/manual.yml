name: Выставить лимитную заявку

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Введите INVEST_TOKEN (пусто — взять из секрета INVEST_TOKEN):'
        default: ''
        required: false
        type: string
      account_id:
        description: 'Введите ACCOUNT_ID:'
        default: ''
        required: true
        type: string
      interval_seconds:
        description: 'Интервал между заявками (0.1 сек, например):'
        default: ''
        required: true
        type: string
      ticker:
        description: 'Введите ticker:'
        default: ''
        required: true
        type: string
      quantity:
        description: 'Введите количество:'
        default: ''
        required: true
        type: string
      direction:
        description: 'Введите sell или buy:'
        default: ''
        required: true
        type: string
      units:
        description: 'Введите целую часть цены:'
        default: ''
        required: true
        type: string
      nano:
        description: 'Введите дробную часть цены(9 цифр):'
        default: ''
        required: true
        type: string
      class_code:
        description: 'Режим торгов: TQBR — акции, TQCB — облигации'
        default: 'TQCB'
        required: false
        type: string
      delay_env:
        description: 'Задержка старта: now / delay-5m / delay-15m / delay-1h'
        required: true
        default: 'now'
        type: choice
        options:
          - now         # без задержки (окружение без правил)
          - delay-5m    # окружение с Wait timer = 5 минут
          - delay-15m   # окружение с Wait timer = 15 минут
          - delay-1h    # окружение с Wait timer = 60 минут

jobs:
  place-order:
    # Триггерим ожидание до запуска раннера с помощью Environment Wait timer
    environment: ${{ inputs.delay_env }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        # tinkoff-investments и его зависимость tinkoff удалены с PyPI (карантин),
        # поэтому SDK ставится с GitHub через --no-deps, а его зависимости — из requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps "git+https://github.com/RussianInvestments/invest-python.git@0.2.0-beta117"

      - name: Run bot
        env:
          INVEST_TOKEN: ${{ inputs.token || secrets.INVEST_TOKEN }}
          ACCOUNT_ID: ${{ inputs.account_id }}
          SANDBOX_TOKEN: ${{ inputs.token || secrets.INVEST_TOKEN }}
          ORDER_DIRECTION: ${{ inputs.direction }}
          ORDER_TICKER: ${{ inputs.ticker }}
          ORDER_UNITS: ${{ inputs.units }}
          ORDER_NANO: ${{ inputs.nano }}
          ORDER_QUANTITY: ${{ inputs.quantity }}
          ORDER_CLASS_CODE: ${{ inputs.class_code }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
          PYTHONPATH: ./
          PYTHONUNBUFFERED: "1"
        run: python src/run_trader.py ema -c config/ema_trader_moex.yaml
